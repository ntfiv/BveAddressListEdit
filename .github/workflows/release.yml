name: Release

# v1.2.3 のようなタグを push すると、ビルドして Releases に zip を公開する
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet build BveAddressListEdit.csproj -c Release -p:Version=$version -o out

      - name: Package
        shell: pwsh
        run: |
          $name = "BveAddressListEdit_${{ github.ref_name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item out/BveAddressListEdit.exe, out/BveAddressListEdit.exe.config $name
          Copy-Item LICENSE "$name/LICENSE.txt"
          # Readme.txt はメモ帳で文字化けしないよう BOM 付き UTF-8 + CRLF にする
          $text = (Get-Content docs/Readme.txt -Raw -Encoding utf8).Replace("__REPO__", "${{ github.repository }}") -replace "`r?`n", "`r`n"
          [IO.File]::WriteAllText("$PWD/$name/Readme.txt", $text, [Text.UTF8Encoding]::new($true))
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          "ZIP=$name.zip" >> $env:GITHUB_ENV

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "$env:ZIP" --title "${{ github.ref_name }}" --generate-notes
